<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Backend Syllabus Tracker</title>
    <script>
      // Surface load/runtime errors instead of showing a blank page.
      window.addEventListener(
        'error',
        function (e) {
          var r = document.getElementById('root');
          if (r && !r.hasChildNodes()) {
            var msg = (e && (e.message || (e.target && e.target.src))) || 'Unknown error';
            r.innerHTML =
              '<div style="max-width:32rem;margin:15vh auto;padding:1.5rem;' +
              'font-family:system-ui,sans-serif;color:#e5e5e5;background:#141414;' +
              'border:1px solid #2a2a2a;border-radius:12px;line-height:1.5">' +
              '<strong style="color:#f87171">The app failed to load.</strong>' +
              '<p style="color:#a3a3a3;font-size:.9rem">' + msg + '</p>' +
              '<p style="color:#737373;font-size:.8rem">If you opened this file directly ' +
              '(file://), serve it over HTTP instead (npm run preview) or use the Netlify ' +
              'URL. If it is deployed, check the VITE_FIREBASE_* environment variables.</p>' +
              '</div>';
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
